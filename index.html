
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Químicos 2A S.A.</title>

<link rel="icon" type="image/png" href="LogoEmpresa.png">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f4faf8;
}

header {
    background: linear-gradient(90deg, #0066a1, #008f5a);
    color: white;
    padding: 18px 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    background-color: white;
    border-radius: 8px;
}

.logo h1 {
    font-size: 25px;
}

nav {
    display: flex;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 15px;
    font-weight: bold;
    padding: 10px 15px;
}

nav a:hover {
    color: #0066a1;
    background-color: #b8f5d8;
    border-radius: 8px;
}

iframe {
    width: 100%;
    height: 1000px;
    border: none;
    display: block;
    background-color: #f4faf8;
}

footer {
    background-color: #005580;
    color: white;
    text-align: center;
    padding: 20px;
}

@media (max-width: 800px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        flex-wrap: wrap;
        justify-content: center;
    }

    nav a {
        margin: 8px 5px;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">

        <img src="LogoEmpresa.png" alt="Logo Químicos 2A S.A.">

        <h1>Químicos 2A S.A.</h1>

    </div>

    <nav>

        <a href="inicio.html" target="contenido">
            Inicio
        </a>

        <a href="empresas.html" target="contenido">
            Empresas
        </a>

        <a href="productos.html" target="contenido">
            Productos
        </a>

        <a href="informacion.html" target="contenido">
            Información
        </a>

    </nav>

</header>

<iframe
    name="contenido"
    id="contenido"
    src="inicio.html">
</iframe>

<footer>

    <p>
        © 2026 Químicos 2A S.A. | Calidad y compromiso
    </p>

</footer>

<script>

const frame = document.getElementById("contenido");

function ajustarAltura() {

    try {

        const altura =
            frame.contentWindow.document.documentElement.scrollHeight;

        frame.style.height = altura + "px";

    } catch (error) {

        frame.style.height = "1200px";

    }

}

frame.addEventListener("load", ajustarAltura);

window.addEventListener("resize", ajustarAltura);

</script>

</body>

</html>
